<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus.AI — Teacher Login Portal</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Orbitron', 'monospace'],
                    },
                    colors: {
                        brand: {
                            cyan: '#00d2ff',
                            emerald: '#10b981',
                            dark: '#050505',
                            panel: 'rgba(20, 20, 25, 0.7)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.08), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.08), transparent 30%);
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans">
    
    <div class="glass-panel w-full max-w-md rounded-2xl p-8 border border-white/10 relative overflow-hidden shadow-2xl">
        <!-- Accent Glow -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-cyan/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-brand-emerald/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-cyan to-brand-emerald flex items-center justify-center mb-4 shadow-[0_0_25px_rgba(0,210,255,0.4)]">
                <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wider text-white">NEXUS<span class="text-brand-cyan">.AI</span></h1>
            <p class="text-xs uppercase tracking-[0.25em] text-brand-emerald font-mono mt-1">Instructor Clearance Portal</p>
        </div>

        <!-- Error Message Alert Box -->
        <div id="error-alert" class="hidden mb-6 bg-red-500/15 border border-red-500/40 text-red-300 px-4 py-3 rounded-xl text-xs font-mono flex items-center gap-3">
            <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="error-text">Invalid credentials.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="flex flex-col gap-5">
            <div>
                <label for="email" class="block text-xs uppercase tracking-wider text-slate-400 font-mono mb-2">Teacher ID / Email</label>
                <div class="relative">
                    <input type="text" id="email" name="email" value="teacher@school.com" required
                        class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-cyan focus:ring-1 focus:ring-brand-cyan transition-all">
                    <div class="absolute right-3 top-3.5 text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs uppercase tracking-wider text-slate-400 font-mono mb-2">Security Key / Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" value="admin123" required
                        class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-cyan focus:ring-1 focus:ring-brand-cyan transition-all">
                    <div class="absolute right-3 top-3.5 text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 font-mono pt-1">
                <span class="flex items-center gap-1.5 text-brand-emerald">
                    <span class="inline-block w-2 h-2 rounded-full bg-brand-emerald animate-pulse"></span>
                    Biometric System Online
                </span>
                <span class="text-slate-500 text-[11px]">Default: admin123</span>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full mt-2 bg-gradient-to-r from-brand-cyan to-blue-600 hover:from-brand-cyan hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(0,210,255,0.3)] hover:shadow-[0_0_30px_rgba(0,210,255,0.5)] transition-all duration-300 transform hover:-translate-y-0.5 tracking-wider uppercase text-sm flex items-center justify-center gap-2">
                <span>Authenticate & Enter Dashboard</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-4">
            <p class="text-[11px] text-slate-500 font-mono">
                Protected by AWS Rekognition & Liveness Anti-Spoofing
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorAlert = document.getElementById('error-alert');
        const errorText = document.getElementById('error-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    submitBtn.innerHTML = '<span>Clearance Approved ✓</span>';
                    // Store token in localStorage for cross-origin iframe persistence
                    localStorage.setItem('nexus_auth_token', data.token);
                    // Navigate to dashboard
                    window.location.href = data.redirect || `/?token=${data.token}`;
                } else {
                    errorText.textContent = data.message || 'Invalid Teacher ID or Password.';
                    errorAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Authenticate & Enter Dashboard</span>';
                }
            } catch (err) {
                // Fallback to standard form submit if fetch fails
                form.method = 'POST';
                form.action = '/login';
                form.submit();
            }
        });
    </script>

</body>
</html>
