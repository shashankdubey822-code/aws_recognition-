<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anyiiiiie.AI — Instructor Clearance Portal</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Orbitron', 'monospace'],
                    },
                    colors: {
                        brand: {
                            cyan: '#0284c7',
                            emerald: '#059669',
                            dark: '#0f172a',
                            panel: 'rgba(255, 255, 255, 0.8)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(2, 132, 199, 0.12), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(5, 150, 105, 0.12), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(241, 245, 249, 0.8), transparent 70%);
            color: #0f172a;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
        }
        .glass-input {
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.8);
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans antialiased">
    
    <div class="glass-panel w-full max-w-md rounded-3xl p-8 sm:p-10 relative overflow-hidden">
        <!-- Ambient Decorative Glows -->
        <div class="absolute -top-12 -right-12 w-36 h-36 bg-sky-400/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-emerald-400/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex flex-col items-center mb-8 relative z-10">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-500 to-emerald-500 flex items-center justify-center mb-4 shadow-[0_10px_25px_rgba(2,132,199,0.3)]">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-wider text-slate-900 font-mono">ANYIIIIIE<span class="text-sky-600">.AI</span></h1>
            <p class="text-[11px] uppercase tracking-[0.25em] text-emerald-600 font-mono font-bold mt-1">Instructor Clearance Portal</p>
        </div>

        <!-- Error Message Alert Box -->
        <div id="error-alert" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl text-xs font-mono flex items-center gap-3">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="error-text">Invalid credentials.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="flex flex-col gap-5 relative z-10">
            <div>
                <label for="email" class="block text-xs uppercase tracking-wider text-slate-500 font-mono font-bold mb-2">Teacher ID / Email</label>
                <div class="relative">
                    <input type="text" id="email" name="email" value="teacher@school.com" required
                        class="glass-input w-full rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400">
                    <div class="absolute right-4 top-3.5 text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs uppercase tracking-wider text-slate-500 font-mono font-bold mb-2">Security Key / Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" value="admin123" required
                        class="glass-input w-full rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400">
                    <div class="absolute right-4 top-3.5 text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-500 font-mono pt-1">
                <span class="flex items-center gap-1.5 text-emerald-600 font-bold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    256-Bit SSL Active
                </span>
                <span>Port 7860</span>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full mt-2 bg-gradient-to-r from-sky-600 to-emerald-600 hover:from-sky-700 hover:to-emerald-700 text-white font-mono font-bold text-xs uppercase tracking-widest py-3.5 px-4 rounded-2xl shadow-[0_10px_20px_rgba(2,132,199,0.25)] transition-all flex items-center justify-center gap-2">
                <span>AUTHENTICATE PORTAL</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-200/80 pt-4">
            <p class="text-[11px] text-slate-400 font-mono">College Automated Biometric Surveillance & Tracking</p>
        </div>
    </div>

    <!-- AJAX Login Logic -->
    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorAlert = document.getElementById('error-alert');
        const errorText = document.getElementById('error-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>VERIFYING CREDENTIALS...</span>';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.token) {
                        localStorage.setItem('nexus_auth_token', data.token);
                    }
                    window.location.href = data.redirect_url || '/';
                } else {
                    errorText.textContent = data.message || "Invalid credentials. Access Denied.";
                    errorAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>AUTHENTICATE PORTAL</span>';
                }
            } catch (err) {
                errorText.textContent = "Network communication error. Please retry.";
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>AUTHENTICATE PORTAL</span>';
            }
        });
    </script>
</body>
</html>
